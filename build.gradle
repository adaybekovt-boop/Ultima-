plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
}

loom {
    splitEnvironmentSourceSets()

    runs {
        configureEach {
            vmArg "-Xmx6G"
            if (project.hasProperty("ultima.jfr")) {
                vmArg "-XX:StartFlightRecording=dumponexit=true,filename=${project.property('ultima.jfr')},settings=profile,maxsize=256m"
                vmArg "-XX:FlightRecorderOptions=stackdepth=128"
            }
        }
        client {
            if (project.hasProperty("ultima.gameDir")) {
                runDir = project.property("ultima.gameDir") as String
            }
        }
        server {
            if (project.hasProperty("ultima.mixinSmoke")) {
                vmArg "-Dultima.mixinSmoke=true"
            }
        }
    }

    mods {
        "ultima" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Soft dependency: compile against the API, do not require Mod Menu at runtime.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Exact, optional adapter surface. Runtime activation also verifies the official jar fingerprint.
    compileOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
}

def ultimaGitSha = providers.exec {
    workingDir rootDir
    commandLine "git", "rev-parse", "HEAD"
}.standardOutput.asText.map { it.trim() }

processResources {
    inputs.property "version", project.version
    inputs.property "git_sha", ultimaGitSha
    filesMatching(["fabric.mod.json", "ultima-build.properties"]) {
        expand "version": project.version, "git_sha": ultimaGitSha.get()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

afterEvaluate {
    def client = sourceSets.findByName("client")
    if (client != null) {
        sourceSets.test.compileClasspath += client.output + client.compileClasspath
        sourceSets.test.runtimeClasspath += client.output + client.runtimeClasspath
    }

    def runClient = tasks.findByName("runClient")
    if (runClient != null && project.hasProperty("ultima.bench")) {
        def jvmFile = file("run/bench-client.jvm.properties")
        if (jvmFile.exists()) {
            def props = new Properties()
            jvmFile.withReader("UTF-8") { reader -> props.load(reader) }
            props.each { key, value ->
                runClient.jvmArgs("-D${key}=${value}")
            }
        }
        def argFile = file("run/bench-client.program.args")
        if (argFile.exists()) {
            argFile.readLines("UTF-8").findAll { line ->
                def trimmed = line.trim()
                !trimmed.isEmpty() && !trimmed.startsWith("#")
            }.each { line ->
                runClient.args(line)
            }
        }
    }
}

tasks.register("forensicRegressionTest", JavaExec) {
    group = "verification"
    description = "Runs the complete merged regression checkpoint for all integrated modules."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.ultima.review.MergedRegressionTest"
}

tasks.register("commandCompactionRecoveryTest", JavaExec) {
    group = "verification"
    description = "Runs pure regression checks for the recovered bounded retained-command compaction contract."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.ultima.review.CommandCompactionRecoveryTest"
}

