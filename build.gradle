plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    runs {
        configureEach {
            vmArg "-Xmx6G"
            if (project.hasProperty("ultima.jfr")) {
                vmArg "-XX:StartFlightRecording=dumponexit=true,filename=${project.property('ultima.jfr')},settings=profile,maxsize=256m"
                vmArg "-XX:FlightRecorderOptions=stackdepth=128"
            }
        }
        client {
            if (project.hasProperty("ultima.gameDir")) {
                runDir = project.property("ultima.gameDir") as String
            }
        }
    }

    mods {
        "ultima" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

afterEvaluate {
    def runClient = tasks.findByName("runClient")
    if (runClient != null && project.hasProperty("ultima.bench")) {
        def jvmFile = file("run/bench-client.jvm.properties")
        if (jvmFile.exists()) {
            def props = new Properties()
            jvmFile.withReader("UTF-8") { reader -> props.load(reader) }
            props.each { key, value ->
                runClient.jvmArgs("-D${key}=${value}")
            }
        }
        def argFile = file("run/bench-client.program.args")
        if (argFile.exists()) {
            argFile.readLines("UTF-8").findAll { line ->
                def trimmed = line.trim()
                !trimmed.isEmpty() && !trimmed.startsWith("#")
            }.each { line ->
                runClient.args(line)
            }
        }
    }
}

tasks.register("forensicRegressionTest", JavaExec) {
    group = "verification"
    description = "Runs dependency-free differential checks for optimization arithmetic."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.ultima.review.ForensicRegressionTest"
}

test {
    failOnNoDiscoveredTests = false
}

check.dependsOn forensicRegressionTest

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
