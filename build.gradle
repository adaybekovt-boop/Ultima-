test {
    enabled = false
    description = "Disabled: Ultima uses named JavaExec regression tasks, not a JUnit suite."
}

tasks.register("frameworkOverheadMicrobench", JavaExec) {
    group = "benchmark"
    description = "Loop timings for the module gate and fail-open door healthy path. Not part of check."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.ultima.failopen.FrameworkOverheadMicrobench"
}

tasks.register("mixinBytecodeTest", JavaExec) {
    group = "verification"
    description = "Checks compiled Mixin annotations and current vanilla bytecode targets with ASM."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.ultima.review.MixinBytecodeChecks"
}

check.dependsOn forensicRegressionTest
check.dependsOn mixinBytecodeTest
check.dependsOn commandCompactionRecoveryTest
check.dependsOn recipeMatchCacheTest
check.dependsOn tagBitsetsTest
check.dependsOn statePropertyCacheTest
check.dependsOn slotMaskEntityQueryTest
check.dependsOn wave2FailOpenTest
check.dependsOn benchmarkReplayTest
check.dependsOn irisArtifactCacheTest
check.dependsOn irisTransformKeyTest
check.dependsOn admissionBrokerTest
check.dependsOn brokerMetricsTest
check.dependsOn renderWarmupTest
check.dependsOn killerDiagnosticsTest

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
