name: Ultima CI validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.target.name }} / ${{ matrix.os }} / run-${{ matrix.repeat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
        target:
          - name: stage1-base
            ref: ea94d594c6d45e7662675dc044792203971cc02d
          - name: code-lab
            ref: 4a4a17e4e47186d9e5317b381d71e6c3d49493fa

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Environment fingerprint
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          java -version
          gradle --version
          uname -a || true

      - name: Generate wrapper
        shell: bash
        run: bash scripts/ensure-wrapper.sh

      - name: Clean build + forensic regression tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon clean build
          python3 scripts/summarize-client-bench.py --self-test

      - name: Clean build + forensic regression tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean build
          python scripts/summarize-client-bench.py --self-test

      - name: Collect build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-${{ matrix.target.name }}-${{ runner.os }}-run${{ matrix.repeat }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
