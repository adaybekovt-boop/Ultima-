name: Ultima CI validation

on:
  pull_request:
    branches:
      - integration/ultima-firstwave-fix-staging-20260819
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ultima-firstwave-fix-staging-20260819
          fetch-depth: 0
      - name: Union hosting-contract module expectations
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/test/java/dev/ultima/review/VanillaClientHostingChecks.java')
          s = p.read_text(encoding='utf-8')
          marker = '            "recipe_match_cache",\n'
          if marker not in s:
              needle = '            "blockentity_sleeping",\n'
              if s.count(needle) != 1:
                  raise SystemExit(f'unexpected blockentity_sleeping anchor count: {s.count(needle)}')
              addition = ('            "recipe_match_cache",\n'
                          '            "tag_bitsets",\n'
                          '            "state_property_cache",\n'
                          '            "container_slot_mask",\n'
                          '            "entity_query_early_out",\n')
              s = s.replace(needle, needle + addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
          for key in recipe_match_cache tag_bitsets state_property_cache container_slot_mask entity_query_early_out; do
            grep -F "\"$key\"" src/test/java/dev/ultima/review/VanillaClientHostingChecks.java
          done
          git diff --check
          git diff --stat
          git add src/test/java/dev/ultima/review/VanillaClientHostingChecks.java
          git config user.name 'Ultima Integration Resolver'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'no source change needed'
            exit 0
          fi
          git commit -m 'Union new server modules into vanilla-hosting contract'
          git push origin HEAD:integration/ultima-firstwave-fix-staging-20260819
