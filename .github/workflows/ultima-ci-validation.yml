name: Ultima CI validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultima-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Environment fingerprint
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          java -version
          ./gradlew --version

      - name: Canonical verification
        shell: bash
        run: bash scripts/check.sh

      - name: Common Mixin apply smoke
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: bash scripts/mixin-smoke.sh

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
            run/logs/latest.log

  runtime:
    name: runtime / real server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Differential scenarios, modules off / off / on
        shell: bash
        timeout-minutes: 25
        run: bash scripts/scenario-diff.sh

      - name: Compatibility with Lithium
        shell: bash
        timeout-minutes: 15
        run: bash scripts/compat-server.sh lithium

      - name: Upload scenario outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-runtime-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/scenarios/**
            run/logs/latest.log

  client:
    name: client / real client under xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a software OpenGL stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1
          pip install --quiet pillow numpy
          xvfb-run -a glxinfo | grep -E "OpenGL (renderer|version)" || true

      - name: Client test, every module off
        shell: bash
        run: bash scripts/client-test.sh baseline

      - name: Client test, every module off again (control for the environment's own noise)
        shell: bash
        run: bash scripts/client-test.sh control

      - name: Client test, shipped defaults
        shell: bash
        run: bash scripts/client-test.sh defaults

      - name: Client test, mesher modules on
        shell: bash
        run: bash scripts/client-test.sh mesher java_mesher,mesher_fast_path,render_snapshot,section_task_queue

      - name: Screenshots with defaults and with mesher modules must equal the baseline
        shell: bash
        run: |
          status=0
          for label in defaults mesher; do
            echo "=== baseline vs $label"
            python3 scripts/compare-screenshots.py build/clienttest/baseline "build/clienttest/$label" \
              --control build/clienttest/control --ignore '01_title.png' '02_settings_*' || status=1
          done
          exit "$status"

      - name: Text pictures of two world screenshots, for reading a failure from the log
        if: failure()
        continue-on-error: true
        shell: bash
        run: python3 scripts/dump-thumbnails.py build/clienttest/baseline/03_world_point1.png build/clienttest/control/03_world_point1.png build/clienttest/baseline/03_world_point3.png build/clienttest/control/03_world_point3.png

      - name: Upload client test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-client-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/clienttest/**
            run/clienttest/logs/latest.log

  compat-client:
    name: client compat / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: modmenu
            mods: modmenu
          - label: lithium
            mods: lithium
          - label: sodium
            mods: sodium
          - label: sodium_iris
            mods: sodium iris

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a software OpenGL stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1

      - name: Client with ${{ matrix.mods }} and every render module requested on
        shell: bash
        run: bash scripts/compat-client.sh ${{ matrix.label }} ${{ matrix.mods }}

      - name: Upload compat outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-client-compat-${{ matrix.label }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/clienttest/**
            run/clienttest/logs/latest.log
