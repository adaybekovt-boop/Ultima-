name: Ultima CI validation

on:
  pull_request:
    branches:
      - integration/ultima-firstwave-fix-staging-20260819
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ultima-firstwave-fix-staging-20260819
          fetch-depth: 0
      - name: Align FSR compatibility regression with merged renderer policy
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/test/java/dev/ultima/review/FsrUpscalingChecks.java')
          s = p.read_text(encoding='utf-8')
          old = '''        assertTrue(\n                FsrCompatibility.evaluate(false, false, true) == FsrCompatibility.DisableReason.NONE,\n                "Sodium alone does not disable FSR");\n        assertTrue(\n                FsrCompatibility.allowsWithSodiumOnly(true, false, false),\n                "Sodium-only is allowed");\n        assertFalse(\n                FsrCompatibility.allowsWithSodiumOnly(true, true, false),\n                "Sodium+Iris is not allowed");'''
          new = '''        assertTrue(\n                FsrCompatibility.evaluate(false, false, true) == FsrCompatibility.DisableReason.SODIUM_OWNS_RENDERER,\n                "Sodium disables FSR in the merged contract");\n        assertFalse(\n                FsrCompatibility.allowsWithSodiumOnly(true, false, false),\n                "Sodium-only is deliberately rejected");\n        assertFalse(\n                FsrCompatibility.allowsWithSodiumOnly(true, true, false),\n                "Sodium+Iris is not allowed");'''
          if new not in s:
              if old not in s:
                  raise SystemExit('unexpected FSR compatibility assertion block')
              s = s.replace(old, new, 1)
          old2 = '''        assertTrue(module.incompatibleMods().contains("iris"), "Iris is a declared post-process owner");\n        assertTrue(module.incompatibleMods().contains("canvas"), "Canvas is a declared renderer owner");\n        assertFalse(module.incompatibleMods().contains("sodium"), "Sodium is not a blanket disable");'''
          new2 = '''        assertTrue(module.incompatibleMods().contains("sodium"), "Sodium is declared incompatible");\n        assertTrue(module.incompatibleMods().contains("iris"), "Iris is a declared post-process owner");\n        assertTrue(module.incompatibleMods().contains("canvas"), "Canvas is a declared renderer owner");'''
          if new2 not in s:
              if old2 not in s:
                  raise SystemExit('unexpected FSR registry assertion block')
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'SODIUM_OWNS_RENDERER' src/test/java/dev/ultima/review/FsrUpscalingChecks.java
          grep -F 'Sodium is declared incompatible' src/test/java/dev/ultima/review/FsrUpscalingChecks.java
          git diff --check
          git diff --stat
          git add src/test/java/dev/ultima/review/FsrUpscalingChecks.java
          git config user.name 'Ultima Integration Resolver'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'no source change needed'
            exit 0
          fi
          git commit -m 'Align FSR regression with renderer auto-disable contract'
          git push origin HEAD:integration/ultima-firstwave-fix-staging-20260819
