name: Ultima CI validation

on:
  pull_request:
    branches:
      - integration/ultima-firstwave-fix-staging-20260819
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ultima-firstwave-fix-staging-20260819
          fetch-depth: 0
      - name: Union hosting-contract module expectations
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/test/java/dev/ultima/review/VanillaClientHostingChecks.java')
          s = p.read_text(encoding='utf-8')
          old = '''            "blockentity_sleeping",
            "server_metrics");'''
          new = '''            "blockentity_sleeping",
            "recipe_match_cache",
            "tag_bitsets",
            "state_property_cache",
            "container_slot_mask",
            "entity_query_early_out",
            "server_metrics");'''
          if new in s:
              print('hosting module union already present')
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('unexpected SIMULATION_MODULES shape')
          PY
          grep -A20 -F 'SIMULATION_MODULES = Set.of(' src/test/java/dev/ultima/review/VanillaClientHostingChecks.java
          git diff --check
          git diff --stat
          git add src/test/java/dev/ultima/review/VanillaClientHostingChecks.java
          git config user.name 'Ultima Integration Resolver'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'no source change needed'
            exit 0
          fi
          git commit -m 'Union new server modules into vanilla-hosting contract'
          git push origin HEAD:integration/ultima-firstwave-fix-staging-20260819
