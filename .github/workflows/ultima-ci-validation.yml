name: Ultima CI validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultima-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Environment fingerprint
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          java -version
          ./gradlew --version

      - name: Canonical verification
        shell: bash
        run: bash scripts/check.sh

      - name: Common Mixin apply smoke
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: bash scripts/mixin-smoke.sh

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
            run/logs/latest.log
