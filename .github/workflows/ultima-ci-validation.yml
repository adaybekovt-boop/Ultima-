name: Ultima CI validation

on:
  push:
    branches:
      - main
      - fix/provenance-compaction-p0
      - integration/ultima-real-merge-20260819
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: current-head / ${{ matrix.os }} / run-${{ matrix.repeat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]

    steps:
      - name: Checkout actual triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Environment fingerprint
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          java -version
          gradle --version
          uname -a || true

      - name: Generate wrapper
        shell: bash
        run: bash scripts/ensure-wrapper.sh

      - name: Gradle test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew --no-daemon test --console=plain

      - name: Gradle build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew --no-daemon build --console=plain

      - name: Static check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check.sh

      - name: Gradle test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon test --console=plain

      - name: Gradle build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon build --console=plain

      - name: Static check (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/check.sh

      - name: Collect build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-current-head-${{ runner.os }}-run${{ matrix.repeat }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
